<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>ARCEUS FF - Headtrick Android</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"><style>*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,sans-serif}body{background:#090102;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.bg-anim{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 25% 20%,rgba(255,25,55,.26),transparent 45%),radial-gradient(circle at 75% 80%,rgba(170,0,25,.28),transparent 50%),#070102;overflow:hidden}.bg-anim::before{content:"";position:absolute;width:200%;height:200%;top:-50%;left:-50%;background-image:radial-gradient(rgba(255,45,75,.38) 1.5px,transparent 1.5px);background-size:34px 34px;animation:pulseGrid 18s linear infinite}@keyframes pulseGrid{0%{transform:translate(0,0)}100%{transform:translate(34px,34px)}}.headtrick-box{position:relative;z-index:1;width:600px;height:600px;max-width:96vw;max-height:96vh;aspect-ratio:1/1;background:rgba(18,3,6,.95);border:1.5px solid rgba(255,35,65,.55);border-radius:20px;display:flex;overflow:hidden;box-shadow:0 0 35px rgba(255,20,50,.32)}.sidebar{width:92px;height:100%;background:rgba(12,2,4,.96);border-right:1px solid rgba(255,35,65,.28);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 0;flex-shrink:0}.brand-thumb{width:54px;height:54px;border-radius:12px;overflow:hidden;border:1.5px solid rgba(255,50,80,.7);background:#1b0307}.brand-thumb img{width:100%;height:100%;object-fit:cover}.nav-tabs{display:flex;flex-direction:column;gap:12px}.tab-btn{width:46px;height:46px;border-radius:12px;border:1px solid rgba(255,45,70,.35);background:rgba(32,5,10,.85);color:#ff9aa6;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}.tab-btn.active{background:linear-gradient(135deg,#ff1e3c,#9e0016);color:#fff;border-color:#ff4d67;box-shadow:0 0 14px rgba(255,30,60,.45)}.tab-btn i,.opt-head i,.sec-title i,.btn-inject i{font-size:20px;line-height:1}.wpp-btn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,60,85,.5);background:rgba(45,6,12,.9);color:#ff546b;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}.wpp-btn i{font-size:20px}.content-area{flex:1;height:100%;padding:16px 14px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#ff2a48 rgba(255,255,255,.08)}.content-area::-webkit-scrollbar{width:5px}.content-area::-webkit-scrollbar-track{background:rgba(255,255,255,.06);border-radius:8px}.content-area::-webkit-scrollbar-thumb{background:#ff2a48;border-radius:8px}.sec-title{display:flex;align-items:center;gap:8px;font-size:1.05rem;font-weight:800;margin-bottom:12px;color:#fff}.opt-card{background:rgba(32,5,10,.9);border:1px solid rgba(255,40,65,.28);border-radius:14px;padding:11px 12px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}.opt-left{display:flex;flex-direction:column;gap:4px}.opt-head{display:flex;align-items:center;gap:7px;font-size:.9rem;font-weight:700;color:#fff}.opt-desc{font-size:.73rem;color:#c7989f;line-height:1.25}.switch{position:relative;width:44px;height:24px;flex-shrink:0}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#3a141a;border-radius:24px;cursor:pointer;transition:.2s;border:1px solid rgba(255,70,95,.35)}.slider::before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:#ff1e3c}.switch input:checked+.slider::before{transform:translateX(20px)}.inject-box{background:rgba(32,5,10,.9);border:1px solid rgba(255,40,65,.32);border-radius:14px;padding:13px;margin-bottom:12px}.inject-box h4{font-size:.92rem;margin-bottom:4px}.inject-box p{font-size:.73rem;color:#c7989f;margin-bottom:10px;line-height:1.3}.btn-inject{width:100%;padding:11px;border:none;border-radius:11px;background:linear-gradient(135deg,#ff1e3c,#a60017);color:#fff;font-weight:800;font-size:.84rem;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}.status-bar{font-size:.75rem;color:#ff8a98;min-height:18px;margin-top:6px}</style></head><body><div class="bg-anim"></div><div class="headtrick-box" id="arceusPanel"><aside class="sidebar"><div class="brand-thumb"><img src="icon.png" alt="ARCEUS FF"></div><div class="nav-tabs"><button class="tab-btn active" id="tabBtn1" type="button" onclick="mudarAba(1)" title="Funções iniciais"><i class="ph ph-crosshair"></i></button><button class="tab-btn" id="tabBtn2" type="button" onclick="mudarAba(2)" title="Funções extras"><i class="ph ph-sliders-horizontal"></i></button><button class="tab-btn" id="tabBtn3" type="button" onclick="mudarAba(3)" title="Escolha sua injeção"><i class="ph ph-game-controller"></i></button></div><a class="wpp-btn" href="https://chat.whatsapp.com/BPLxLpUYZYMIR2CODFzbEP?s=cl&p=a&iam=2" target="_blank" rel="noopener noreferrer" title="WhatsApp"><i class="ph ph-whatsapp-logo"></i></a></aside><main class="content-area" id="viewContainer"></main></div><script>const ST_RECOIL="ARCEUS_AND_NO_RECOIL",ST_HEAD="ARCEUS_AND_MANTER_CABECA",ST_TREME="ARCEUS_AND_REMOVER_TREMEDEIRAS",ST_AIMLOCK="ARCEUS_AND_BRUTLE_AIMLOCK",ST_AIMASSIST="ARCEUS_AND_AIM_ASSIST",ST_DELAY="ARCEUS_AND_REMOVER_DELAY",ST_CONTROL="ARCEUS_AND_CONTROLE_MIRA";let abaAtual=1;function renderAba(n){abaAtual=n;const container=document.getElementById("viewContainer");while(container.firstChild){container.removeChild(container.firstChild)}document.querySelectorAll(".tab-btn").forEach((b,idx)=>{b.classList.toggle("active",idx+1===n)});if(n===1){container.insertAdjacentHTML("beforeend",`<div class="sec-title"><i class="ph ph-target"></i><span>Funções iniciais:</span></div><div class="opt-card"><div class="opt-left"><div class="opt-head"><i class="ph ph-shield-check"></i><span>No recoil:</span></div><div class="opt-desc">Reduz o recuo para manter a mira mais estável durante os disparos.</div></div><label class="switch"><input type="checkbox" data-st="${ST_RECOIL}" onchange="toggleSwitch(this)"><span class="slider"></span></label></div><div class="opt-card"><div class="opt-left"><div class="opt-head"><i class="ph ph-crosshair-simple"></i><span>Manter disparos na cabeça:</span></div><div class="opt-desc">Todos os disparos enviados, serão redirecionados á cabeça do oponente com maior e extrema precisão.</div></div><label class="switch"><input type="checkbox" data-st="${ST_HEAD}" onchange="toggleSwitch(this)"><span class="slider"></span></label></div><div class="opt-card"><div class="opt-left"><div class="opt-head"><i class="ph ph-waves"></i><span>Remover "tremedeiras":</span></div><div class="opt-desc">Ao subir o botão de disparo, todas as possibilidades e tentativas de quebra de pixels que ocasionam tremedeiras, serão realinhadas com extrema e máxima precisão.</div></div><label class="switch"><input type="checkbox" data-st="${ST_TREME}" onchange="toggleSwitch(this)"><span class="slider"></span></label></div><div class="opt-card"><div class="opt-left"><div class="opt-head"><i class="ph ph-lock-key"></i><span>Brutle aimlock:</span></div><div class="opt-desc">Após os primeiros disparos enviados ao oponente, todos os outros disparos irão se manter em perfeito alinhamento e sem riscos de desalinhamento.</div></div><label class="switch"><input type="checkbox" data-st="${ST_AIMLOCK}" onchange="toggleSwitch(this)"><span class="slider"></span></label></div><div class="status-bar" id="statusMsg"></div>`)}else if(n===2){container.insertAdjacentHTML("beforeend",`<div class="sec-title"><i class="ph ph-briefcase"></i><span>Funções extras:</span></div><div class="opt-card"><div class="opt-left"><div class="opt-head"><i class="ph ph-scan"></i><span>Aim assist:</span></div><div class="opt-desc">Assistência extra para ajudar a manter a mira próxima do alvo.</div></div><label class="switch"><input type="checkbox" data-st="${ST_AIMASSIST}" onchange="toggleSwitch(this)"><span class="slider"></span></label></div><div class="opt-card"><div class="opt-left"><div class="opt-head"><i class="ph ph-timer"></i><span>Remover delay:</span></div><div class="opt-desc">Todos os possíveis delays internos e externos, serão corrigidos e removidos de forma correta.</div></div><label class="switch"><input type="checkbox" data-st="${ST_DELAY}" onchange="toggleSwitch(this)"><span class="slider"></span></label></div><div class="opt-card"><div class="opt-left"><div class="opt-head"><i class="ph ph-sliders"></i><span>Controle de mira:</span></div><div class="opt-desc">Controle refinado para uma resposta de mira mais consistente.</div></div><label class="switch"><input type="checkbox" data-st="${ST_CONTROL}" onchange="toggleSwitch(this)"><span class="slider"></span></label></div><div class="status-bar" id="statusMsg"></div>`)}else if(n===3){container.insertAdjacentHTML("beforeend",`<div class="sec-title"><i class="ph ph-download-simple"></i><span>Escolha sua injeção:</span></div><div class="inject-box"><h4>Free Fire</h4><p>Ao clicar no botão abaixo, todas as alterações selecionadas serão injetadas ao (Free Fire PADRÃO).</p><button class="btn-inject" type="button" onclick="aplicarEabrir('free fire://')"><i class="ph ph-syringe"></i><span>Aplicar alterações:</span></button></div><div class="inject-box"><h4>Free Fire MAX</h4><p>Ao clicar no botão abaixo, todas as alterações selecionadas serão injetadas ao (Free Fire MAX).</p><button class="btn-inject" type="button" onclick="aplicarEabrir('freefiremax://')"><i class="ph ph-syringe"></i><span>Aplicar alterações:</span></button></div><div class="status-bar" id="statusMsg"></div>`)}sincronizarSwitches()}function mudarAba(n){renderAba(n)}function sincronizarSwitches(){document.querySelectorAll('input[type="checkbox"][data-st]').forEach(chk=>{chk.checked=localStorage.getItem(chk.getAttribute("data-st"))==="1"})}function toggleSwitch(chk){localStorage.setItem(chk.getAttribute("data-st"),chk.checked?"1":"0")}function aplicarEabrir(schemeUrl){const cfg={[ST_RECOIL]:localStorage.getItem(ST_RECOIL)==="1",[ST_HEAD]:localStorage.getItem(ST_HEAD)==="1",[ST_TREME]:localStorage.getItem(ST_TREME)==="1",[ST_AIMLOCK]:localStorage.getItem(ST_AIMLOCK)==="1",[ST_AIMASSIST]:localStorage.getItem(ST_AIMASSIST)==="1",[ST_DELAY]:localStorage.getItem(ST_DELAY)==="1",[ST_CONTROL]:localStorage.getItem(ST_CONTROL)==="1",platform:"Android",scheme:schemeUrl,updatedAt:Date.now()};localStorage.setItem("ARCEUS_AND_ACTIVE_CFG",JSON.stringify(cfg));window.location.href=schemeUrl}window.addEventListener("DOMContentLoaded",()=>renderAba(1));</script></body></html>
